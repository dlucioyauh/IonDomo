name: IONKOD Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-audit:
    name: Secrets & Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Security Scan
        run: |
          gitleaks detect --source . --verbose --report-format json --report-path gitleaks-report.json
        continue-on-error: false

      - name: Check for hardcoded secrets in Kotlin files
        run: |
          if grep -rnw . -E "password\s*=\s*['\"]admin|senha\s*=\s*['\"]123|api_key\s*=\s*['\"]sk_" --include="*.kt" --include="*.kts" --include="*.java" --include="*.xml"; then
            echo "::error::Hardcoded secrets detected in source code!"
            exit 1
          fi

      - name: Verify .env is not tracked
        run: |
          if git ls-files | grep -E "\.env$"; then
            echo "::error::.env file is tracked by Git!"
            exit 1
          fi

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: gitleaks-report.json
          retention-days: 30
